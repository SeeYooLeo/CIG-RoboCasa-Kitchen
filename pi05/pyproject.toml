[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocasa-kitchen-pi05"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.7.1", "transformers==4.53.2", "safetensors==0.5.3",
  "jax==0.5.3", "flax==0.10.2", "orbax-checkpoint==0.11.13",
  "numpy==1.26.4", "jaxtyping==0.2.36", "beartype==0.19.0",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
  "augmax>=0.3.4", "einops>=0.8.0", "fsspec[gcs]>=2024.6.0",
  "numpydantic>=1.6.6,<2", "opencv-python>=4.10,<4.12", "pillow>=11",
  "sentencepiece>=0.2", "typing-extensions>=4.12.2", "filelock>=3.16",
  "tyro>=0.9.5,<1", "wandb==0.22.3", "tqdm-loggable>=0.2",
  "h5py>=3.10", "etils[epath]>=1.9", "optax>=0.2.3,<0.3",
  "websockets==15.0.1", "msgpack>=1.0.5"
]
[project.optional-dependencies]
cuda = ["jax[cuda12]==0.5.3"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["openpi*"]
