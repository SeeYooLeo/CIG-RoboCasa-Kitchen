[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocasa-kitchen-oft"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.2.0", "torchvision==0.17.0", "numpy==1.26.4",
  "transformers @ git+https://github.com/moojink/transformers-openvla-oft.git@bc339d9ad707454c0c115970db43c260067c61ab",
  "dlimp @ git+https://github.com/moojink/dlimp_openvla.git@040105d256bd28866cc6620621a3d5f7b6b91b46",
  "tensorflow==2.15.0", "tensorflow-datasets==4.9.3", "tensorflow-graphics==2021.12.3",
  "peft==0.11.1", "timm==0.9.10", "tokenizers==0.19.1", "draccus==0.8.0",
  "accelerate>=0.25,<1", "huggingface-hub>=0.23,<1", "sentencepiece==0.1.99",
  "einops", "json-numpy", "rich", "wandb>=0.16,<0.23", "tqdm", "pillow",
  "pandas", "pyarrow", "websockets==15.0.1", "msgpack>=1.0.5"
]
[tool.setuptools]
py-modules = ["policy_utils"]
[tool.setuptools.packages.find]
where = ["."]
include = ["prismatic*"]
